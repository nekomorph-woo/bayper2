<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:">
  <title>Bayper 动画审查</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #eceff1; color: #1f2933; font: 14px/1.4 system-ui, sans-serif; }
    body.dark { background: #14171a; color: #eef2f5; }
    .player { display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 16px; }
    .stage { display: grid; place-items: center; padding: 8px; border: 1px solid #8a939b55; background: #fafafa; }
    body.dark .stage { background: #1c2024; }
    #frame { display: block; image-rendering: pixelated; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
    button, select { font: inherit; padding: 4px 10px; }
    #status { min-width: 160px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main class="player">
    <div class="stage"><img id="frame" alt="当前帧"></div>
    <div class="controls">
      <button id="play">暂停</button>
      <button id="prev">上一帧</button>
      <button id="next">下一帧</button>
      <label>速度
        <select id="speed">
          <option value="1">1×</option>
          <option value="0.25">0.25×</option>
        </select>
      </label>
      <button id="background">背景：浅</button>
      <span id="status"></span>
    </div>
  </main>
  <script src="player.js"></script>
</body>
</html>
