<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>连接 — Bayper</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/connections.css" />
  </head>
  <body data-page="connections">
    <div class="app">
      <aside class="sidebar" aria-label="应用导航"></aside>

      <main class="main">
        <header class="toolbar">
          <div class="toolbar__id">
            <h1 class="toolbar__title">连接</h1>
            <p class="toolbar__sub" id="connSub"></p>
          </div>
        </header>

        <div class="workspace conn-grid reveal">
          <section class="pane conn-sources" aria-label="Herdr 来源与 Agent">
            <header class="pane__head">
              <h2>来源与 Agent</h2>
            </header>
            <div class="pane__body" id="sources"></div>
          </section>

          <section class="pane conn-notif" aria-label="通知记录">
            <header class="pane__head">
              <h2>通知记录</h2>
              <div class="filters" id="filters" aria-label="筛选通知"></div>
            </header>
            <div class="pane__body" id="notifs" aria-live="polite"></div>
          </section>
        </div>
      </main>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/connections.js"></script>
  </body>
</html>
