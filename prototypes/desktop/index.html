<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小窝 — Bayper</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/home.css" />
  </head>
  <body data-page="home">
    <div class="app">
      <aside class="sidebar" aria-label="应用导航"></aside>

      <main class="main">
        <header class="toolbar">
          <div class="toolbar__id">
            <h1 class="toolbar__title">小窝</h1>
            <p class="toolbar__sub" id="homeSub"></p>
          </div>
        </header>

        <div class="workspace home-grid reveal">
          <section class="stage" id="stage" aria-label="现在的陪伴"></section>

          <aside class="inspector" aria-label="今日名单与最近见闻">
            <section class="pane" aria-labelledby="rosterTitle">
              <header class="pane__head">
                <h2 id="rosterTitle">今日名单</h2>
                <span class="pane__hint" id="rosterHint"></span>
              </header>
              <div class="pane__body" id="roster"></div>
            </section>

            <section class="pane pane--news" aria-labelledby="newsTitle">
              <header class="pane__head">
                <h2 id="newsTitle">最近见闻</h2>
                <a class="pane__more" href="stories.html">全部</a>
              </header>
              <div class="pane__body" id="news"></div>
            </section>
          </aside>
        </div>
      </main>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/home.js"></script>
  </body>
</html>
